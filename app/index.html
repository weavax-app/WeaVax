<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WeaVax · LifeOS Web & Desktop</title>
    <meta name="theme-color" content="#0A0A0F">
    <link rel="icon" type="image/png" href="../weavax_logo.png">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { accent: 'var(--color-primary, #8B5CF6)' } } }
        }
    </script>
    <style>
        :root { --color-primary: #8B5CF6; }
        body { font-family: 'Inter', sans-serif; background-color: #0A0A0F; color: #F9FAFB; }
        html:not(.dark) body { background-color: #F8FAFC; color: #0F172A; }
        .bg-accent { background-color: var(--color-primary); }
        .text-accent { color: var(--color-primary); }
        .border-accent { border-color: var(--color-primary); }
    </style>
</head>
<body class="min-h-screen antialiased">

    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0A0A0F]">
        <img src="../weavax_logo.png" alt="WeaVax" class="w-14 h-14 object-contain animate-pulse mb-4">
        <p class="text-xs font-semibold uppercase tracking-widest text-gray-400">Cargando LifeOS...</p>
    </div>

    <div id="auth-screen" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 bg-[#0A0A0F]">
        <div class="w-full max-w-md p-8 rounded-3xl bg-[#181824] border border-[#28283C] shadow-2xl text-center">
            <img src="../weavax_logo.png" alt="WeaVax" class="w-14 h-14 object-contain mx-auto mb-3">
            <h1 class="text-2xl font-black text-white">WeaVax <span class="text-xs px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400">LifeOS</span></h1>
            <button id="btn-google-login" class="mt-6 w-full py-3.5 px-4 rounded-xl bg-white text-gray-900 font-bold text-sm">Continuar con Google</button>
            <form id="email-login-form" class="mt-4 space-y-3">
                <input type="email" id="login-email" required placeholder="Correo" class="w-full px-4 py-3 rounded-xl bg-[#0A0A0F] border border-[#28283C] text-sm">
                <input type="password" id="login-password" required placeholder="Contraseña" class="w-full px-4 py-3 rounded-xl bg-[#0A0A0F] border border-[#28283C] text-sm">
                <button type="submit" class="w-full py-3 rounded-xl bg-purple-600 text-white font-bold text-sm">Entrar</button>
            </form>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 border-r border-gray-200 dark:border-[#28283C] bg-white dark:bg-[#181824]">
            <div class="h-16 px-6 flex items-center space-x-2.5 border-b border-gray-200 dark:border-[#28283C]">
                <img src="../weavax_logo.png" class="w-7 h-7 object-contain">
                <span class="font-black text-lg">WeaVax</span>
            </div>
            <div class="p-4 border-b border-gray-200 dark:border-[#28283C]">
                <p id="user-name" class="text-sm font-bold truncate">Marce</p>
                <p id="user-level-xp" class="text-[11px] text-gray-400">Nivel 1 · 0 XP</p>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1 text-sm font-medium">
                <button onclick="navigate('dashboard')" data-nav="dashboard" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-accent/15 text-accent font-bold"><span>🏠</span><span>Inicio / Mi Día</span></button>
                <button onclick="navigate('finances')" data-nav="finances" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-400"><span>💳</span><span>Finanzas</span></button>
                <button onclick="navigate('settings')" data-nav="settings" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-400"><span>⚙️</span><span>Ajustes & Limpieza</span></button>
            </nav>
        </aside>

        <main class="flex-1 md:pl-64 pb-20">
            <header class="h-16 px-6 flex items-center justify-between border-b border-gray-200 dark:border-[#28283C]">
                <h2 id="header-greeting" class="text-lg font-extrabold">Hola, Marce</h2>
                <div class="flex items-center space-x-2.5">
                    <span class="px-3 py-1 rounded-full bg-[#181824] border border-[#28283C] text-xs font-bold">🔥 <span id="streak-count">0 d</span></span>
                    <span class="px-3.5 py-1 rounded-full bg-accent/15 border border-accent/40 text-accent text-xs font-extrabold">Día <span id="daily-score-pct">0</span>%</span>
                </div>
            </header>

            <div class="max-w-6xl mx-auto p-6">
                <!-- DASHBOARD -->
                <section id="view-dashboard" class="app-view grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="p-6 rounded-2xl bg-white dark:bg-[#181824] border border-gray-200 dark:border-[#28283C]">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold uppercase text-gray-400">Balance Consolidado</span>
                            <button onclick="toggleBalancePrivacy()" class="text-sm">👁️‍🗨️</button>
                        </div>
                        <div id="dashboard-total-balance" class="text-3xl font-black my-2">Bs •••••</div>
                    </div>

                    <div class="p-6 rounded-2xl bg-white dark:bg-[#181824] border border-gray-200 dark:border-[#28283C]">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-sm font-extrabold">Hábitos de Hoy</h3>
                            <button onclick="openHabitModal()" class="text-xs font-bold text-accent">+ Nuevo</button>
                        </div>
                        <div id="dashboard-habits-list" class="space-y-2.5"></div>
                    </div>

                    <div class="p-6 rounded-2xl bg-white dark:bg-[#181824] border border-gray-200 dark:border-[#28283C]">
                        <h3 class="text-sm font-extrabold mb-4">Agenda de Hoy</h3>
                        <div id="dashboard-agenda-list" class="space-y-2.5"></div>
                    </div>
                </section>

                <!-- FINANZAS -->
                <section id="view-finances" class="app-view hidden space-y-6">
                    <h3 class="text-xl font-black">Finanzas Multi-Moneda</h3>
                    <div id="accounts-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
                    <div class="p-6 rounded-2xl bg-white dark:bg-[#181824] border border-gray-200 dark:border-[#28283C]">
                        <h4 class="text-sm font-extrabold mb-4">Historial de Movimientos</h4>
                        <div id="transactions-list" class="space-y-2"></div>
                    </div>
                </section>

                <!-- AJUSTES & LIMPIEZA -->
                <section id="view-settings" class="app-view hidden space-y-6">
                    <div class="p-6 rounded-2xl bg-white dark:bg-[#181824] border border-gray-200 dark:border-[#28283C] space-y-4">
                        <h3 class="text-base font-extrabold">Mantenimiento de Base de Datos</h3>
                        <p class="text-xs text-gray-400">Ruta activa: <code id="diag-active-path" class="text-accent"></code></p>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="cleanFirestoreDuplicates()" class="px-4 py-2.5 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs font-bold">
                                🧹 Limpiar Duplicados de Firestore
                            </button>
                            <button onclick="logoutUser()" class="px-4 py-2.5 rounded-xl bg-red-500/15 text-red-400 text-xs font-bold">Cerrar Sesión</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- MODAL UNIVERSAL -->
    <div id="universal-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75">
        <div class="w-full max-w-md p-6 rounded-3xl bg-[#181824] border border-[#28283C]">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-base font-extrabold"></h3>
                <button onclick="closeUniversalModal()">✕</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { initSync, fsActions } from './firebase-sync.js';
        import { renderDashboard } from './ui-dashboard.js';
        import { renderFinances } from './ui-finances.js';

        window.openUniversalModal = (title, html) => {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('universal-modal').classList.remove('hidden');
        };
        window.closeUniversalModal = () => document.getElementById('universal-modal').classList.add('hidden');
        window.toggleBalancePrivacy = () => { window.state.isBalanceVisible = !window.state.isBalanceVisible; renderFinances(); };
        window.deleteDocItem = async (col, id) => { if (confirm('¿Eliminar?')) await fsActions.remove(col, id); };
        window.toggleTask = (id, s) => fsActions.update('tasks', id, { isCompleted: s });

        window.navigate = (v) => {
            document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));
            document.getElementById('view-' + v).classList.remove('hidden');
        };

        initSync(() => {
            const p = window.state.profile;
            const xp = Number(p.xp || 0);
            document.getElementById('user-level-xp').textContent = `Nivel ${Math.floor(xp / 100) + 1} · ${xp} XP`;
            document.getElementById('streak-count').textContent = `${p.streak || 0} d`;
            renderDashboard();
            renderFinances();
        });
    </script>
</body>
</html>
